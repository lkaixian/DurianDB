<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DurianDB Console</title>
<style>
/* Palette: paper, ink, one rust accent used only for unacknowledged alarms and the limit line.
   System fonts: no network dependency, tabular numerals keep live values from jittering. */
:root{--paper:#f4f2ec;--ink:#1c211e;--muted:#565e58;--rule:#cfcabd;--accent:#9a3b00;--focus:#1c211e}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#171a18;--ink:#ecebe4;--muted:#a3aba5;--rule:#3a403c;--accent:#ff9a5c;--focus:#ecebe4}}
:root[data-theme=dark]{--paper:#171a18;--ink:#ecebe4;--muted:#a3aba5;--rule:#3a403c;--accent:#ff9a5c;--focus:#ecebe4}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,"Segoe UI",sans-serif}
.num,td.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:20px 16px 12px;border-bottom:2px solid var(--ink);max-width:1100px;margin:0 auto}
h1{font-size:1.25rem;margin:0;letter-spacing:.01em}
header p{margin:0;color:var(--muted);font-size:.9rem}
main{max-width:1100px;margin:0 auto;padding:0 16px 48px;display:grid;gap:40px;grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
@media (max-width:820px){main{grid-template-columns:1fr}}
h2{font-size:1rem;margin:28px 0 8px}
h2 small{font-weight:400;color:var(--muted)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;font-size:.85rem;color:var(--muted);border-bottom:1px solid var(--ink);padding:6px 8px 6px 0}
td{padding:10px 8px 10px 0;border-bottom:1px solid var(--rule);vertical-align:top}
tr.open td:first-child{box-shadow:none}
.lvl{font-weight:700}
tr.open .lvl{color:var(--accent)}
tr.done{color:var(--muted)}
button{font:inherit;min-height:44px;min-width:44px;padding:0 14px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:3px;cursor:pointer}
button:hover{background:var(--ink);color:var(--paper)}
.status{padding:16px 0;color:var(--muted)}
.status.err{color:var(--accent);font-weight:600}
.pt{padding:12px 0;border-bottom:1px solid var(--rule)}
.pt div{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.pt .val{font-size:1.5rem;font-weight:600}
.pt .val.over{color:var(--accent)}
svg{width:100%;height:56px;display:block;margin-top:6px}
svg .line{fill:none;stroke:var(--ink);stroke-width:1.5}
svg .lim{stroke:var(--accent);stroke-width:1;stroke-dasharray:4 3}
</style>
</head>
<body>
<header>
  <h1>DurianDB Console</h1>
  <p>Teaching build. Data is simulated.</p>
</header>
<main>
  <section aria-labelledby="alarms-h">
    <h2 id="alarms-h">Alarms <small id="alarm-count"></small></h2>
    <div id="alarms" class="status">Loading alarms...</div>
  </section>
  <section aria-labelledby="pts-h">
    <h2 id="pts-h">Live points <small>last 2 minutes, dashed line is the alarm limit</small></h2>
    <div id="points" class="status">Loading points...</div>
  </section>
</main>
<script>
const LEVELS=["None","Information","Important","Warning","Urgent","Critical","Life safety"];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=t=>new Date(t*1000).toLocaleTimeString();

async function api(path,opts){
  const r=await fetch(path,opts);
  if(!r.ok) throw new Error(path+" returned "+r.status);
  return r.json();
}

function spark(h,limit){
  if(h.length<2) return "";
  const vs=h.map(p=>p.value).concat(limit), lo=Math.min(...vs), hi=Math.max(...vs), span=(hi-lo)||1;
  const y=v=>52-((v-lo)/span)*48, x=i=>(i/(h.length-1))*300;
  const d=h.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.value).toFixed(1)).join("");
  return `<svg viewBox="0 0 300 56" preserveAspectRatio="none" role="img" aria-label="Recent values"><line class="lim" x1="0" x2="300" y1="${y(limit)}" y2="${y(limit)}"/><path class="line" d="${d}"/></svg>`;
}

function renderPoints(pts){
  $("points").className="";
  $("points").innerHTML=pts.length?pts.map(p=>`<div class="pt"><div><span>${esc(p.name)}</span><span class="val num ${p.last>p.limit?"over":""}">${p.last??"no value yet"}</span></div>${spark(p.history,p.limit)}</div>`).join(""):'<p class="status">No points configured. Add one to a data source in <code>durian/server.py</code>.</p>';
}

function renderAlarms(evs){
  const open=evs.filter(e=>e.acked_ts==null).length;
  $("alarm-count").textContent=evs.length?`${open} unacknowledged of ${evs.length}`:"";
  if(!evs.length){$("alarms").className="status";$("alarms").textContent="No alarms yet. One is raised when a point crosses its limit; the simulated boiler temperature drifts upward and will get there.";return}
  $("alarms").className="";
  $("alarms").innerHTML=`<table><thead><tr><th>Level</th><th>Point</th><th>Detail</th><th>Raised</th><th><span class="sr">Action</span></th></tr></thead><tbody>`+
    evs.map(e=>`<tr class="${e.acked_ts==null?"open":"done"}"><td class="lvl">${LEVELS[e.level]}</td><td>${esc(e.point)}</td><td class="num">${esc(e.message)}</td><td class="num">${fmt(e.ts)}</td><td>${e.acked_ts==null?`<button data-ack="${e.id}" aria-label="Acknowledge alarm on ${esc(e.point)} at ${fmt(e.ts)}">Acknowledge</button>`:"Acknowledged "+fmt(e.acked_ts)}</td></tr>`).join("")+"</tbody></table>";
}

$("alarms").addEventListener("click",async ev=>{
  const id=ev.target.dataset.ack; if(!id) return;
  ev.target.disabled=true;
  try{await api(`/api/events/${id}/ack`,{method:"POST"});await refresh()}
  catch(e){ev.target.disabled=false;showErr(e)}
});

function showErr(e){
  for(const id of ["alarms","points"]){$(id).className="status err";$(id).textContent="Cannot reach the DurianDB server ("+e.message+"). Is `python -m durian.server` running? Retrying every 2 seconds."}
}

async function refresh(){
  try{const [p,e]=await Promise.all([api("/api/points"),api("/api/events")]);renderPoints(p);renderAlarms(e)}
  catch(e){showErr(e)}
}
refresh();setInterval(refresh,2000);
</script>
<style>.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}</style>
</body>
</html>
