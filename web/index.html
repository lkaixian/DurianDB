<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DurianDB Console</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header>
  <button type="button" id="menu" aria-controls="nav" aria-expanded="false" hidden>Menu</button>
  <h1>DurianDB</h1><span id="ptitle" class="ptitle"></span>
  <span class="hdr">
    <button type="button" id="cmdk" aria-keyshortcuts="Control+K" hidden>Search <kbd>Ctrl K</kbd></button>
    <span id="conn" class="conn" role="status" hidden></span>
    <button type="button" id="snd" class="link" aria-pressed="false" hidden>Alarm sound: off</button> <a id="alarm-count" class="ac" href="#alarms" hidden></a>
    <button type="button" id="theme"></button>
    <details id="acct" class="menu" hidden><summary></summary><div class="pop"><a href="#account">Account and security</a><a href="#about">About</a><button type="button" id="logout-menu">Log out</button><p id="ver"></p></div></details>
  </span>
</header>
<div id="banner" role="alert" hidden></div>
<div class="shell solo">
  <nav id="nav" aria-label="Sections"></nav>
  <main id="main" tabindex="-1"><p class="status">Loading console...</p></main>
</div>
<div id="toasts" role="status" aria-live="polite"></div>
<noscript><p class="status err">The console needs JavaScript to show live data.</p></noscript>
<script src="/dashboards.js"></script>
<script src="/forms.js"></script>
<script src="/admin.js"></script>
<script src="/alarms.js"></script>
<script src="/overview.js"></script>
<script src="/point.js"></script>
<script src="/history.js"></script>
<script src="/reports.js"></script>
<script src="/config.js"></script>
<script src="/users.js"></script>
<script src="/account.js"></script>
<script src="/app.js"></script>
</body>
</html>
