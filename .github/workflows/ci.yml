name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests on ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check paho-mqtt cryptography
      - name: Test suite
        run: python tests/run_all.py
      - name: Syntax check the console scripts
        run: |
          node --check web/app.js
          node --check web/forms.js
          node --check web/dashboards.js
          node --check web/admin.js
