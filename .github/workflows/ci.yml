name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests on ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Test suite
        run: python tests/run_all.py
      - name: Syntax check the console scripts
        run: |
          node --check web/app.js
          node --check web/forms.js
          node --check web/dashboards.js
          node --check web/admin.js
          node --check web/alarms.js
          node --check web/overview.js
          node --check web/point.js
          node --check web/history.js
          node --check web/reports.js
          node --check web/config.js
          node --check web/users.js
          node --check web/account.js

  browser:
    name: browser checks (headless Chromium)
    # Every check gets a throwaway database and browser profile, so one job can run them back to back. Eleven
    # checks take about seven minutes on a laptop, hence the ceiling rather than a guess at a per-step timeout.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Install Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce  # v1
        with:
          chrome-version: stable
      - name: Run the browser checks
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          DURIAN_ADMIN_PASSWORD: durian-admin-123
        run: node tools/browser_ci.mjs

  mysql:
    name: tests on MariaDB
    # One cell only: the SQLite path already runs on all four cells above, and the MySQL path is the same code
    # on every Python and OS, so running it four times would quadruple the cost for no extra coverage.
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: durian_test
          MARIADB_USER: durian
          MARIADB_PASSWORD: durian
          MARIADB_ROOT_PASSWORD: durian-root
        ports:
          - "3306:3306"  # Published on this job's runner only, so nothing outside the runner can reach it.
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the dependencies, including the MySQL driver
        run: python -m pip install --disable-pip-version-check -r requirements.txt "pymysql>=1.1"
      - name: Test suite on MariaDB
        # The URLs below are literals pointing at the service container on this runner, and the suite drops
        # every table in that database first, so the step has no way to point at any other server.
        env:
          DURIAN_TEST_STORE_URL: "mysql://durian:durian@127.0.0.1:3306/durian_test"
          DURIAN_TEST_MYSQL_URL: "mysql://durian:durian@127.0.0.1:3306/durian_test"
        run: python tests/run_all.py

  rust:
    name: real-time core (experimental)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the detector core
        working-directory: rust
        run: cargo test --locked
      - name: Clippy
        working-directory: rust
        run: cargo clippy --locked -- -D warnings
