name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests on ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Test suite
        run: python tests/run_all.py
      - name: Syntax check the console scripts
        run: |
          node --check web/app.js
          node --check web/forms.js
          node --check web/dashboards.js
          node --check web/admin.js
          node --check web/alarms.js
          node --check web/overview.js
          node --check web/point.js
          node --check web/history.js
          node --check web/reports.js
          node --check web/config.js
          node --check web/users.js
          node --check web/account.js

  rust:
    name: real-time core (experimental)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the detector core
        working-directory: rust
        run: cargo test --locked
      - name: Clippy
        working-directory: rust
        run: cargo clippy --locked -- -D warnings
