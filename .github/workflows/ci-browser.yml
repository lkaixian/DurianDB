name: CI / browser

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  browser:
    name: browser checks (headless Chromium)
    # Every check gets a throwaway database and browser profile, so one job can run them back to back. Eleven
    # checks take about seven minutes on a laptop, hence the ceiling rather than a guess at a per-step timeout.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Install Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce  # v1
        with:
          chrome-version: stable
      - name: Run the browser checks
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          DURIAN_ADMIN_PASSWORD: durian-admin-123
        run: node tools/browser_ci.mjs
